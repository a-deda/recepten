[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Vastzetten, niet aan Netlify overlaten: vite 8 eist node ^20.19 || >=22.12
  # en @netlify/functions 6 eist >=22.12. Op een oudere default faalt de build
  # en staat er dus geen enkele function — wat zich uit als een 404 op
  # /api/... in plaats van als een duidelijke bouwfout.
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # pdf-parse bundelt slecht: het sleept pdfjs met workerbestanden mee. Als
  # extern pakket meesturen in plaats van inbundelen.
  external_node_modules = ["pdf-parse"]

# Paden:
#   /api/intake                            -> netlify/functions/intake.ts (config.path)
#   /.netlify/functions/worker-background   -> de queue-verwerker (background function,
#                                              15 minuten runtime, antwoordt direct 202)
# Beide URL's staan als Script Property in Apps Script.

# SPA-fallback: alles wat geen bestand of function is, gaat naar index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
